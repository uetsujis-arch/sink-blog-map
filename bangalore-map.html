<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINK夫婦の世界ブログ地図</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1E8D0;
    --paper-dark: #E7DAB8;
    --bg-blue: #2C6B8F;
    --bg-blue-dark: #1F4F69;
    --ink: #223A5E;
    --ink-soft: #445576;
    --vermillion: #C7451C;
    --gold: #E8A33D;
    --grass: #7A9B57;
    --hotel-blue: #2F6FBF;
  }
  .sink-map-embed, .sink-map-embed *{box-sizing:border-box;}
  .sink-map-embed{margin:0;padding:0;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);display:flex;flex-direction:column;background:var(--bg-blue);height:640px;max-height:85vh;border-radius:6px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.18);}

  /* ---- Header ---- */
  .sink-map-embed header{
    position:relative;
    background:
      radial-gradient(rgba(255,249,236,0.08) 1px, transparent 1px) 0 0/14px 14px,
      var(--bg-blue);
    padding:12px 20px 16px;
    text-align:center;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 90%,
      97% 96%, 94% 91%, 91% 97%, 88% 92%, 85% 97%, 82% 91%, 79% 97%,
      76% 92%, 73% 97%, 70% 91%, 67% 97%, 64% 92%, 61% 97%, 58% 91%,
      55% 97%, 52% 92%, 49% 97%, 46% 91%, 43% 97%, 40% 92%, 37% 97%,
      34% 91%, 31% 97%, 28% 92%, 25% 97%, 22% 91%, 19% 97%, 16% 92%,
      13% 97%, 10% 91%, 7% 97%, 4% 92%, 0% 96%
    );
  }
  .sink-map-embed .header-top{
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .sink-map-embed .stamp{
    width:42px;height:42px;flex:none;
    margin:0;
    border-radius:50%;
    box-shadow:0 0 0 2px #fff9ec, 0 2px 6px rgba(0,0,0,.25);
  }
  .sink-map-embed .stamp img{width:100%;height:100%;object-fit:contain;display:block;}
  .sink-map-embed h1{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:clamp(18px,4vw,24px);
    margin:0;
    letter-spacing:.04em;
    color:#fff9ec;
  }
  .sink-map-embed header .sub{
    display:inline-block;
    margin:6px 0 8px;
    font-size:12px;
    color:#fff9ec;
    background:var(--bg-blue-dark);
    padding:3px 11px;
    border-radius:2px;
  }

  /* ---- Legend / filter ---- */
  .sink-map-embed .legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .sink-map-embed .chip{
    display:flex;align-items:center;gap:5px;
    border:1px solid var(--ink-soft);
    background:#fff9ec;
    padding:3px 10px 3px 6px;
    border-radius:999px;
    cursor:pointer;
    font-size:12px;font-weight:700;color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
    user-select:none;
  }
  .sink-map-embed .chip .dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:#ddd;}
  .sink-map-embed .chip.active{color:#fff9ec;}
  .sink-map-embed .chip.active[data-cat="food"]{background:var(--vermillion);border-color:var(--vermillion);}
  .sink-map-embed .chip.active[data-cat="travel"]{background:var(--grass);border-color:var(--grass);}
  .sink-map-embed .chip.active[data-cat="hotel"]{background:var(--hotel-blue);border-color:var(--hotel-blue);}
  .sink-map-embed .chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}

  /* ---- Map ---- */
  .sink-map-embed #sink-map-wrap{flex:1;position:relative;min-height:200px;}
  .sink-map-embed #sink-map{height:100%;width:100%;background:var(--paper);filter:sepia(.18) saturate(.85) brightness(1.05) contrast(.96);}
  .sink-map-embed .leaflet-control-attribution{
    font-size:9px !important;
    background:rgba(241,232,208,0.85) !important;
    color:var(--ink-soft) !important;
  }

  /* ---- Markers & clusters ---- */
  .sink-map-embed .spot-marker{
    width:32px;height:32px;border-radius:50%;
    border:2px solid #fff9ec;
    box-shadow:0 1px 4px rgba(34,58,94,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff9ec;
    cursor:pointer;
  }
  .sink-map-embed .spot-marker.draft{
    filter:grayscale(.85);
    opacity:.55;
    border-style:dashed;
    box-shadow:none;
  }
  .sink-map-embed .cluster-badge{
    width:38px;height:38px;border-radius:50%;
    border:2px solid #fff9ec;
    box-shadow:0 1px 4px rgba(34,58,94,.4);
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:14px;color:#fff9ec;
  }
  .sink-map-embed .cluster-badge.draft{
    filter:grayscale(.85);
    opacity:.6;
    border-style:dashed;
    box-shadow:none;
  }
  @media (prefers-reduced-motion: no-preference){
    .sink-map-embed .spot-marker:hover{transform:scale(1.12);}
  }

  /* ---- Popup (postcard style) ---- */
  .sink-map-embed .leaflet-popup-content-wrapper{background:#FBF6E9;border-radius:3px;box-shadow:0 6px 18px rgba(34,58,94,.28);padding:0;}
  .sink-map-embed .leaflet-popup-content{margin:0;width:230px !important;}
  .sink-map-embed .leaflet-popup-tip{background:#FBF6E9;}
  .sink-map-embed .card{position:relative;padding:18px 16px 16px;}
  .sink-map-embed .tape{position:absolute;top:-10px;left:14px;width:52px;height:20px;background:rgba(232,163,61,0.55);border:1px solid rgba(232,163,61,0.7);transform:rotate(-5deg);}
  .sink-map-embed .card .cat-label{font-size:10px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;}
  .sink-map-embed .card h2{font-family:'Shippori Mincho',serif;font-size:16px;margin:4px 0 6px;color:var(--ink);}
  .sink-map-embed .card .note{font-family:'Yomogi',cursive;font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 12px;transform:rotate(-.4deg);}
  .sink-map-embed .card a.cta{display:inline-block;font-size:13px;font-weight:700;color:#fff9ec;background:var(--ink);padding:6px 12px;border-radius:2px;text-decoration:none;letter-spacing:.03em;}
  .sink-map-embed .card a.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .sink-map-embed .card .soon{display:inline-block;font-size:12px;color:var(--ink-soft);background:var(--paper-dark);padding:5px 10px;border-radius:2px;}
  .sink-map-embed .card .map-link{display:block;margin-top:9px;font-size:11px;color:var(--ink-soft);text-decoration:underline;}
  .sink-map-embed .card .map-link:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
</style>
</head>

966],[98.788585,-0.956638],[98.840017,-0.922459],[98.898204,-0.915704],[98.891612,-0.935479],[98.917979,-0.940118],[98.945811,-0.984633],[98.939301,-1.003676],[98.905284,-0.990655],[98.938324,-1.065118],[98.980317,-1.093683],[99.067638,-1.241388],[99.053071,-1.272638],[99.077647,-1.28338],[99.11671,-1.366632],[99.164724,-1.414239],[99.165294,-1.456231],[99.130544,-1.428888],[99.130626,-1.448175],[99.203624,-1.517267],[99.209727,-1.572931],[99.262055,-1.586684],[99.274425,-1.634942]]]],"type":"MultiPolygon"}}],"type":"FeatureCollection"};

  // 地図の中心にする経度(日本)。この値を基準に、表示できる経度の範囲を「日本を中心にした360度分」だけに絞る
  const CENTER_LNG = 138;
  const map = L.map('sink-map', {
    scrollWheelZoom: false,
    maxBounds: [[-60, CENTER_LNG - 180], [85, CENTER_LNG + 180]],
    maxBoundsViscosity: 1.0
  });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 16
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16
  }).addTo(map);

  L.geoJSON(countryHighlights, {
    style: { fillColor: '#A9C08C', fillOpacity: 0.5, color: '#7A9B57', weight: 1, opacity: 0.45 },
    interactive: false,
    coordsToLatLng: function(coords) {
      let lng = coords[0];
      if (lng < CENTER_LNG - 180) lng += 360;
      return L.latLng(coords[1], lng, coords[2]);
    }
  }).addTo(map);

  // カテゴリごとにクラスターグループを分けて作る(混ざったクラスタにならないように)
  const clusterGroups = {};
  Object.keys(categories).forEach(cat => {
    clusterGroups[cat] = L.markerClusterGroup({
      iconCreateFunction: function(cluster){
        const allDraft = cluster.getAllChildMarkers().every(m => m.spotDraft);
        return L.divIcon({
          html: `<div class="cluster-badge${allDraft ? ' draft' : ''}" style="background:${categories[cat].color}">${cluster.getChildCount()}</div>`,
          className: '', iconSize: L.point(38,38)
        });
      }
    });
  });

  const allMarkers = [];
  spots.forEach(spot => {
    const cat = categories[spot.category];
    const isDraft = !spot.articleUrl;
    const icon = L.divIcon({
      className: '',
      html: `<div class="spot-marker${isDraft ? ' draft' : ''}" style="background:${cat.color}">${cat.icon}</div>`,
      iconSize: [32,32], iconAnchor: [16,16], popupAnchor: [0,-14]
    });

    // articleUrl を入れるだけで、ピンは自動的にグレー→カラー、バッジ→リンクに切り替わる
    const cta = spot.articleUrl
      ? `<a class="cta" href="${spot.articleUrl}">記事を読む →</a>`
      : `<span class="soon">📝 近日公開予定</span>`;

    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}`;
    const mapLink = `<a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">📍 Google Mapで見る</a>`;

    const html = `
      <div class="card">
        <div class="tape"></div>
        <div class="cat-label">${cat.label}</div>
        <h2>${spot.name}</h2>
        <p class="note">${spot.note}</p>
        ${cta}
        ${mapLink}
      </div>`;

    // 日本を中心にした帯(CENTER_LNG-180 〜 CENTER_LNG+180)に収まるよう、表示用の経度だけをずらす
    let displayLng = spot.lng;
    if (displayLng < CENTER_LNG - 180) displayLng += 360;
    const marker = L.marker([spot.lat, displayLng], { icon }).bindPopup(html);
    marker.spotDraft = isDraft;
    clusterGroups[spot.category].addLayer(marker);
    allMarkers.push(marker);
  });

  Object.values(clusterGroups).forEach(g => map.addLayer(g));

  // 埋め込み先のレイアウトが確定する前に地図が初期化されると、サイズを誤認識してピンが描画されないことがあるため、表示直前にサイズを再計算する
  map.invalidateSize();

  // 日本を中心にした初期表示(世界全体が見える低ズームで固定)
  map.setView([36.5, CENTER_LNG], 2);

  // カテゴリ切り替え(チップをクリックで表示/非表示)
  document.querySelectorAll('.chip').forEach(chip => {
    chip.setAttribute('tabindex', '0');
    chip.setAttribute('role', 'button');
    const toggle = () => {
      const cat = chip.dataset.cat;
      const isActive = chip.classList.toggle('active');
      if (isActive) { map.addLayer(clusterGroups[cat]); }
      else { map.removeLayer(clusterGroups[cat]); }
    };
    chip.addEventListener('click', toggle);
    chip.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }});
  });

  // フォント読み込み等で埋め込み先のレイアウトが後から変わった場合の保険
  window.addEventListener('load', () => map.invalidateSize());
</script>
</body>
</html>
